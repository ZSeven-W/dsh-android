# Build and run the full fixture suite on every push and PR.
#
# Three jobs, cheapest first:
#
#   static     build plus the host-agnostic static smokes — the fast gate
#   suites     typecheck and every fixture suite
#   emulator   boots a real Android emulator; experimental, so a flaky boot
#              cannot block a PR
#
# Unlike the iOS twin there is no macOS-only job for the core: adb is the only
# toolchain the plugin talks to and it runs everywhere, so Linux is the honest
# home for both gates. Optional Tesseract OCR is additionally executed on
# native Windows/Linux runners; the Vision compile path remains macOS-only.
#
# DSH_ANDROID_SMOKE_SKIP_DEVICE=1 keeps the first two jobs deterministic. A
# green check is therefore NOT a claim that a phone works: the physical-device
# path is verified by a human, on a device, against the README checklist.
name: Plugin check

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tesseract:
    name: Native OCR / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install Linux Tesseract
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Install Windows Tesseract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $dshTessExe = Join-Path $env:ProgramFiles 'Tesseract-OCR/tesseract.exe'
          if (-not (Test-Path $dshTessExe)) { throw 'Tesseract executable missing' }
          "DSHPLUGIN_ANDROID_TESSERACT_BINARY=$dshTessExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fetch pinned language data
        shell: pwsh
        run: |
          $dshTessDir = Join-Path $env:RUNNER_TEMP 'dsh-tessdata'
          New-Item -ItemType Directory -Force -Path $dshTessDir | Out-Null
          $dshTessRevision = '87416418657359cb625c412a48b6e1d6d41c29bd'
          $dshTessDigests = @{
            eng = '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2'
            chi_sim = 'a5fcb6f0db1e1d6d8522f39db4e848f05984669172e584e8d76b6b3141e1f730'
          }
          foreach ($dshLang in $dshTessDigests.Keys) {
            $dshModelPath = Join-Path $dshTessDir "$dshLang.traineddata"
            Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$dshTessRevision/$dshLang.traineddata" -OutFile $dshModelPath
            if ((Get-FileHash $dshModelPath -Algorithm SHA256).Hash.ToLower() -ne $dshTessDigests[$dshLang]) { throw "Language digest mismatch: $dshLang" }
          }
          "DSHPLUGIN_ANDROID_TESSERACT_DATA_DIR=$dshTessDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Native Chinese/Latin recognition and pixel tool delivery
        run: node scripts/dev-tesseract-native-smoke.mjs
      - name: Stream target liveness regression
        run: node scripts/dev-target-resolution-smoke.mjs

  static:
    name: Node 24 / build + static smokes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Static smoke — adb toolchain, frame splitter, host lifecycle
        run: node scripts/dev-adb-smoke.mjs
        env:
          DSH_ANDROID_SMOKE_SKIP_DEVICE: '1'
      - name: Static smoke — signed routes (fake host, no adb)
        run: node scripts/dev-routes-static-smoke.mjs
        env:
          DSH_ANDROID_SMOKE_SKIP_DEVICE: '1'
      - name: Static smoke — device panel (SSR only)
        # The panel suite lands with the client; skip cleanly until it does.
        run: |
          if [ -f scripts/dev-panel-smoke.mjs ]; then
            node scripts/dev-panel-smoke.mjs
          else
            echo "scripts/dev-panel-smoke.mjs is not present yet — skipping."
          fi
        env:
          DSH_ANDROID_SMOKE_SKIP_DEVICE: '1'

  suites:
    name: Node 24 / fixture suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Fixture suites
        run: pnpm test
        env:
          DSH_ANDROID_SMOKE_SKIP_DEVICE: '1'

  emulator:
    # Experimental: boots a real Android emulator through KVM on the Linux
    # runner. Marked continue-on-error so a flaky boot cannot block a PR.
    name: Linux / live emulator smoke (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build

      # The emulator needs hardware acceleration; without KVM a boot takes
      # long enough to time the job out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Live emulator smoke (boots an AVD)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: node scripts/dev-emulator-smoke.mjs
